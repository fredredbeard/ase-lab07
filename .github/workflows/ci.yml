name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the Bruno CLI
        run: npm install -g @usebruno/cli@4.3.0

      # Component tests: calc alone, with the stub of history
      - name: Start calc and its stub
        run: docker compose -f compose.calc.yaml up --build -d --wait

      - name: Component tests of calc
        working-directory: tests/bruno
        run: bru run calc calc-stub --env calc-component

      - name: Show the logs of calc and its stub
        if: failure()
        run: docker compose -f compose.calc.yaml logs

      - name: Stop calc and its stub
        if: always()
        run: docker compose -f compose.calc.yaml down
